# Live DLTP checks of the app against the real testnet nodes (read-only). Run from the Actions tab.
name: Live testnet

on:
  workflow_dispatch:
  push:
    branches: ['live/**']

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter test test/live --reporter expanded --dart-define=NETWORK_ID=deltanium-test --dart-define=CENTRAL_API_BASE=https://testnet-api.deltanium.com/api
        env:
          LIVE_TESTNET: '1'
